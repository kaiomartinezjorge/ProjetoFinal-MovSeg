services:
  postgres:
    image: postgres:16-alpine
    container_name: movseg-postgres
    environment:
      POSTGRES_DB: movseg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - movseg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movseg"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: movseg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-movsegadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-movsegsecret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - movseg_minio:/data

volumes:
  movseg_pgdata:
  movseg_minio:
