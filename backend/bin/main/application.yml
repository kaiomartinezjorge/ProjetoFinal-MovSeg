server:
  port: ${PORT:8080}

spring:
  application:
    name: movseg-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movseg}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

movseg:
  demo:
    enabled: ${MOVSEG_DEMO_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  storage:
    root-dir: ${STORAGE_DIR:./storage/evidences}
    bucket-name: ${STORAGE_BUCKET:movseg-evidencias}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
